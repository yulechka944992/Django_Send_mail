{% extends "base.html" %}

{% block title %}Удаление клиента{% endblock %}

{% block content %}
    <h1>Удалить получателя?</h1>
    <p>Вы уверены, что хотите удалить <strong>{{ object.last_name }} {{ object.first_name }}</strong> ({{ object.email }})?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="color: red;">Да, удалить</button>
        <a href="{% url 'recipients:list' %}">Отмена</a>
    </form>
{% endblock %}
