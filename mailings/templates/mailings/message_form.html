{% extends "base.html" %}

{% block title %}{% if object %}Редактировать{% else %}Создать{% endif %} сообщение{% endblock %}

{% block content %}
    <div class="card shadow-sm mt-4">
        <div class="card-body">
            <h1 class="h3 mb-4">{% if object %}Редактировать{% else %}Создать{% endif %} сообщение</h1>
            <form method="post">
                {% csrf_token %}
                
                <!-- Ручной вывод полей для красоты (вместо form.as_p) -->
                <div class="mb-3">
                    <label for="{{ form.subject.id_for_label }}" class="form-label">Тема письма</label>
                    {{ form.subject }}
                </div>
                <div class="mb-3">
                    <label for="{{ form.body.id_for_label }}" class="form-label">Тело письма</label>
                    {{ form.body }}
                </div>
                
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'mailings:message_list' %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
