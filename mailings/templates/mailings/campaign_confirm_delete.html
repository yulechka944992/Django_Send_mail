{% extends "base.html" %}

{% block title %}Удаление рассылки{% endblock %}

{% block content %}
    <div class="card shadow-sm mt-4 border-danger">
        <div class="card-body">
            <h1 class="h3 text-danger mb-3">Удалить рассылку?</h1>
            <p>Вы уверены, что хотите удалить рассылку <strong>#{{ object.pk }}</strong> (Тема: {{ object.message.subject }})?</p>
            
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{% url 'mailings:campaign_list' %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
