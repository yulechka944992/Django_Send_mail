{% extends "base.html" %}

{% block title %}Список сообщений{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h2">Список сообщений</h1>
        <a href="{% url 'mailings:message_create' %}" class="btn btn-primary">+ Создать сообщение</a>
    </div>
    
    <div class="card shadow-sm">
        <div class="card-body">
            {% if messages %}
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Тема</th>
                            <th class="text-end">Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for msg in messages %}
                        <tr>
                            <td>
                                <a href="{% url 'mailings:message_detail' msg.pk %}" class="text-decoration-none">
                                    {{ msg.subject }}
                                </a>
                            </td>
                            <td class="text-end">
                                <a href="{% url 'mailings:message_update' msg.pk %}" class="btn btn-sm btn-outline-secondary">✏️</a>
                                <a href="{% url 'mailings:message_delete' msg.pk %}" class="btn btn-sm btn-outline-danger">❌</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <p class="text-muted mb-0">Пока нет ни одного сообщения.</p>
            {% endif %}
        </div>
    </div>
{% endblock %}
